<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lager">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#c2410c">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Lager-Organizer</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--line:#e3e1d9;--acc:#c2410c;--acc2:#fff3ea;--ok:#15803d;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#211f1d;--ink:#f1efe8;--mute:#a09d92;--line:#35332e;--acc:#fb923c;--acc2:#2c2118;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) 112px env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:6;background:var(--bg);padding:10px 14px 8px;max-width:760px;margin:auto;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:14px}
main{max-width:760px;margin:auto;padding:0 12px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));max-width:none}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;color:var(--mute);font:inherit;font-size:11px;padding:4px 2px;border-radius:10px;cursor:pointer}
.tabs button .ti{font-size:22px;line-height:1.1}
.tabs button.on{color:var(--acc);font-weight:700;background:var(--acc2)}
.av,.ico{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;color:#fff;font-weight:700;flex:none}
.ico{border-radius:12px;background:var(--acc2);color:inherit}
.av img,.ico img{width:100%;height:100%;object-fit:cover;display:block}
.pbtn{border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.toolbar{display:flex;gap:8px;align-items:center;margin:10px 0}
.srch{flex:1}
.fab{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:26px;line-height:1;cursor:pointer}
.fab.on{background:var(--mute)}
.seg-row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:8px 12px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.card.fold{padding:0;overflow:hidden}
.fold-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);font:inherit;text-align:left;padding:10px 12px;cursor:pointer}
.fold-h .fh-t{flex:1;min-width:0;display:flex;flex-direction:column}
.fold-h small{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{display:inline-block;transition:transform .15s;color:var(--mute);width:12px}
.fold.open .chev{transform:rotate(90deg)}
.fold-b{padding:0 12px 12px;border-top:1px solid var(--line)}
.hitrow{cursor:pointer}
.seg button{padding:8px 10px}
.seg.sm{align-self:flex-start}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.pbar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.inv-sum{display:flex;gap:14px;font-weight:600;font-size:15px}
.inv-sum .ok{color:#15803d}.inv-sum .diffc{color:#a16207}.inv-sum .missc{color:#b91c1c}
.inv-row{padding:8px 0;border-top:1px solid var(--line);border-left:4px solid transparent;padding-left:8px;margin-left:-8px}
.inv-row.ok{border-left-color:#15803d;background:color-mix(in srgb,#15803d 8%,transparent)}
.inv-row.diff{border-left-color:#ca8a04;background:color-mix(in srgb,#ca8a04 10%,transparent)}
.inv-row.miss{border-left-color:#b91c1c;background:color-mix(in srgb,#b91c1c 9%,transparent)}
.inv-main{display:flex;align-items:center;gap:8px}
.inv-main .n{flex:1;min-width:0}
.ibs{display:flex;gap:6px}
.ib{width:46px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.ib:disabled{opacity:.5}
.ib.ok.on{background:#15803d;color:#fff;border-color:#15803d}
.ib.diff.on{background:#ca8a04;color:#fff;border-color:#ca8a04}
.ib.miss.on{background:#b91c1c;color:#fff;border-color:#b91c1c}
.inv-q{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding-top:6px}
.warnbox{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;background:var(--acc2)}
details.hist{border-top:1px solid var(--line);padding:8px 0}
details.hist summary{cursor:pointer;font-weight:600}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;outline:1px solid var(--line)}
.swatch.on{border-color:var(--ink)}
.cinp{width:48px;height:36px;padding:2px}
.emo{display:flex;flex-wrap:wrap;gap:6px}
.emo-b{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:22px;cursor:pointer}
.emo-b.on{border-color:var(--acc);background:var(--acc2)}
.trow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);color:var(--ink);font-size:16px;margin:0}
.trow small{display:block;color:var(--mute);font-size:12px;font-weight:400}
body.compact .card{padding:8px 10px;margin:6px 0}
body.compact .item{padding:5px 0}
body.compact .fold-h{padding:6px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h2,.card h3{margin:0 0 8px;font-size:17px}
form.add{display:grid;gap:8px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:2px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;min-width:0}
.row{display:grid;grid-template-columns:90px 1fr;gap:8px}
button.pri{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
button.ghost.danger{color:var(--bad)}
.chip{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:99px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0;font-weight:600}
.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .n{flex:1;min-width:0}
.item .n small{display:block;color:var(--mute);font-size:12px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;line-height:1;cursor:pointer}
.qty b{min-width:26px;text-align:center}
.boxhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mute{color:var(--mute);font-size:13px}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:10;max-width:90vw}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ok{color:var(--ok);font-weight:600}.warn{color:#d97706;font-weight:600}.bad{color:var(--bad);font-weight:600}
textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;min-height:96px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:var(--ok)}
input[type=checkbox]{width:22px;height:22px;flex:none;padding:0;accent-color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.hit{background:var(--acc2)}

/* ---------- Layout-Korrekturen ---------- */
button{max-width:100%;box-sizing:border-box}
.seg-row{flex-wrap:wrap}
.seg{max-width:100%}
.seg-row .seg{flex:1 1 auto}
.seg button{white-space:nowrap;flex:1 0 auto;min-width:0;font-size:13.5px}
.seg-row>button.ghost{white-space:nowrap;flex:none}
.actions>button{flex:1 1 auto;white-space:normal;text-align:center}
.fold-h .fh-t{min-width:0}
.card,.fold-b,.item .n{min-width:0}
/* ---------- Liquid-Bewegung (ohne Glas) ---------- */
:root{--spring:cubic-bezier(.34,1.56,.64,1)}
button,.fab,.swatch,.emo-b{transition:transform .38s var(--spring),background-color .2s,box-shadow .25s,border-color .2s;-webkit-tap-highlight-color:transparent}
button:active:not(:disabled){transform:scale(.94)}
.fold-h:active:not(:disabled){transform:scale(.985)}
.fab:active{transform:scale(.88) rotate(90deg)}
.fab{box-shadow:0 6px 16px rgba(0,0,0,.18)}
button.pri{box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 30%,transparent)}
.tabs{left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 24px);max-width:520px;bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;border:1px solid var(--line);border-radius:30px;box-shadow:0 10px 28px rgba(0,0,0,.16);gap:0}
.tabs button{position:relative;z-index:1;background:none!important}
.tabs button.on{background:none!important}
.tabs button .ti{transition:transform .45s var(--spring)}
.tabs button.on .ti{transform:translateY(-1px) scale(1.15)}
.tabs .pill{position:absolute;z-index:0;top:6px;bottom:6px;left:0;width:0;border-radius:24px;background:var(--acc2);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 22%,transparent);transition:left .5s var(--spring),width .5s var(--spring)}
.toast{bottom:104px;animation:toastIn .5s var(--spring)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,24px) scale(.85)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes unfold{from{opacity:0;transform:translateY(-10px) scaleY(.9)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes chev{from{transform:rotate(0)}to{transform:rotate(90deg)}}
body.anim .fold-b,body.anim form.add,body.anim .warnbox{animation:unfold .5s var(--spring) both;transform-origin:top center}
body.anim .fold.open>.fold-h .chev{animation:chev .45s var(--spring) both}
body.anim .seg button.on,body.anim .swatch.on,body.anim .emo-b.on,body.anim .ib.on{animation:pop .45s var(--spring)}
body.page main>*{animation:rise .5s var(--spring) both}
body.page main>*:nth-child(2){animation-delay:.04s}body.page main>*:nth-child(3){animation-delay:.08s}body.page main>*:nth-child(n+4){animation-delay:.12s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="hd"></header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast" hidden></div>

<script src="firebase-config.js"></script>
<script id="data" type="application/json">{"boxes":[],"items":[],"updated":0}</script>
<script>
(function(){
"use strict";

/* ---------- Zustand ---------- */
var LS="lager-organizer-v1";
var state=migrate(load());
var LEGACY={add:"lager",kisten:"lager",kategorien:"lager",suche:"lager",daten:"mehr"};
function normTab(t){t=LEGACY[t]||t;return ["lager","freizeit","stamm","mehr"].indexOf(t)<0?"lager":t;}
var tab=normTab((location.hash||"#lager").slice(1));
var query="";
var confirmId=null;

function load(){
  var emb={boxes:[],items:[],updated:0};
  try{emb=JSON.parse(document.getElementById("data").textContent);}catch(e){}
  try{
    var l=JSON.parse(localStorage.getItem(LS)||"null");
    if(l && l.updated>(emb.updated||0)) return l;
  }catch(e){}
  return emb;
}
function migrate(st){
  if(!Array.isArray(st.trips)) st.trips=[];
  if(!st.alias||typeof st.alias!=="object") st.alias={};
  if(!Array.isArray(st.cats)) st.cats=[];
  st.cats=st.cats.filter(function(c){return c&&c.id&&typeof c.name==="string"&&c.name;});
  if(!Array.isArray(st.invHist)) st.invHist=[];
  if(!st.inv||typeof st.inv!=="object"||!st.inv.res||typeof st.inv.res!=="object") st.inv=null;
  st.boxes.forEach(function(b){
    if(!b.cat){
      var m={},best="Sonstiges",bq=-1;
      st.items.forEach(function(i){if(i.box===b.id){var c=i.cat||"Sonstiges";m[c]=(m[c]||0)+i.qty;}});
      Object.keys(m).forEach(function(c){if(m[c]>bq){bq=m[c];best=c;}});
      b.cat=best;
    }
  });
  st.items.forEach(function(i){
    var b=st.boxes.filter(function(x){return x.id===i.box;})[0];
    if(b) i.cat=b.cat;
    else if(!i.box){i.box="";i.cat=i.cat||"Sonstiges";}
  });
  return st;
}
function uid(){return Math.random().toString(36).slice(2,9);}

/* ---------- Speichern ---------- */
var pubTimer=null, artifactNS=null, dirty=false;
claude_init();
function claude_init(){
  try{
    if(window.claude && window.claude.use){
      window.claude.use("artifact").then(function(a){artifactNS=a||null;},function(){});
      window.claude.use("sample").then(function(s){sampleNS=s||null;},function(){});
    }
  }catch(e){}
}
var sampleNS=null;
function save(){
  if(cloud.sid){
    if(cloud.loading){toast("Daten werden noch geladen …");return;}
    if(!canEditNow()){
      if(cloud.base){try{state=migrate(JSON.parse(cloud.base));}catch(e){}}
      toast("Nur Lesen – du darfst nichts ändern");return;
    }
    migrate(state);cloud.dirty=true;schedulePush();return;
  }
  migrate(state);
  state.updated=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
  dirty=true;
  schedulePublish();
}
function schedulePublish(){
  if(!artifactNS) return;
  clearTimeout(pubTimer);
  pubTimer=setTimeout(doPublish,3000);
}
function doPublish(){
  if(!artifactNS||!dirty) return;
  var ae=document.activeElement;
  if(ae && (ae.tagName==="INPUT"||ae.tagName==="SELECT")){schedulePublish();return;}
  dirty=false;
  var clone=document.documentElement.cloneNode(true);
  clone.querySelector("#app").innerHTML="";
  clone.querySelector("#tabs").innerHTML="";
  clone.querySelector("#stats").textContent="";
  var t=clone.querySelector("#toast"); t.hidden=true; t.textContent="";
  clone.querySelector("#data").textContent=JSON.stringify(state).replace(/</g,"\\u003c");
  var html="<!DOCTYPE html>\n"+clone.outerHTML;
  artifactNS.publish(html).then(function(){},function(e){});
}

/* ---------- Kategorien automatisch ---------- */
var RULES=[
 ["Spiele",["spielekiste","spiele","kendama","frisbee","badminton","slackline","wikinger"]],
 ["Feuer",["feuer","magnesium","zunder"]],
 ["Werkzeug",["hammer","schraub","bohr","säge","zange","werkzeug","schlüssel","wasserwaage","akku","nägel","dübel","schrauben","feile","meißel","zollstock"]],
 ["Kabel & Zubehör",["kabel","ladegerät","netzteil","adapter","stecker","verlängerung","steckdose","usb","hdmi","batterie"]],
 ["Elektronik",["laptop","computer","monitor","tastatur","maus","handy","tablet","kamera","lautsprecher","radio","router","drucker","fernseher","konsole","kopfhörer","lampe","glühbirne","led"]],
 ["Kleidung",["hose","shirt","t-shirt","pullover","jacke","mantel","schuh","socke","kleid","mütze","schal","handschuh","hemd","jeans","stiefel","unterwäsche"]],
 ["Bettwäsche & Textilien",["bettwäsche","decke","kissen","handtuch","vorhang","laken","teppich","stoff","matratze"]],
 ["Küche & Haushalt",["küche","dutch","teller","tasse","glas","topf","pfanne","besteck","messer","gabel","löffel","schüssel","kaffee","mixer","toaster","backform","vase","kerze","putz","reiniger","schwamm","eimer"]],
 ["Bücher & Papier",["buch","bücher","ordner","zeitschrift","heft","akte","dokument","unterlagen","papier","album","foto","comic","roman"]],
 ["Büro",["stift","kugelschreiber","tacker","locher","büro","umschlag","klebeband","schere","notizbuch","etikett"]],
 ["Medien",["cd","dvd","blu-ray","schallplatte","vinyl","kassette","spiel","videospiel"]],
 ["Spielzeug",["spielzeug","lego","puppe","teddy","puzzle","brettspiel","kuscheltier","auto","playmobil","bauklötze"]],
 ["Sport & Freizeit",["ball","fahrrad","helm","ski","hantel","yoga","schläger","rucksack","skateboard","inliner","schlittschuh","angel"]],
 ["Camping & Outdoor",["zelt","schlafsack","campingkocher","isomatte","laterne","wanderstock","grill"]],
 ["Garten",["gartenschlauch","blumentopf","erde","dünger","samen","gieß","rasen","harke","spaten","schaufel","pflanze","blumen"]],
 ["Deko & Saison",["weihnacht","deko","christbaum","lichterkette","kugel","ostern","halloween","bilderrahmen","rahmen"]],
 ["Bad & Hygiene",["shampoo","seife","zahn","rasier","handtuch","duschgel","creme","bad","föhn"]],
 ["Farben & Renovierung",["farbe","pinsel","rolle","tapete","kleber","lack","spachtel","abdeck","silikon"]],
 ["Auto & Fahrrad",["reifen","öl","scheibenwischer","fahrradpumpe","kettenöl","felge","kfz"]],
 ["Lebensmittel",["konserve","nudeln","reis","mehl","zucker","vorrat","dose","getränk","wasser"]]
];
function guessCategory(name){
  var n=name.toLowerCase();
  for(var i=0;i<RULES.length;i++){
    var kws=RULES[i][1];
    for(var j=0;j<kws.length;j++){ if(n.indexOf(kws[j])>=0) return RULES[i][0]; }
  }
  return null;
}
function allCategories(){
  var s={};
  state.items.forEach(function(i){s[i.cat]=1;});
  state.boxes.forEach(function(b){if(b.cat)s[b.cat]=1;});
  (state.cats||[]).forEach(function(c){s[c.name]=1;});
  RULES.forEach(function(r){s[r[0]]=1;});
  s["Sonstiges"]=1;
  return Object.keys(s).sort(function(a,b){return a.localeCompare(b,"de");});
}
function aiCategory(name){
  if(!sampleNS) return Promise.resolve(null);
  var cats=allCategories().join(", ");
  var p="Ordne eine Lagerkiste einer Kategorie zu. Kiste und erster Inhalt: "+name+". Bestehende Kategorien: "+cats+". "+
        "Nimm eine bestehende, wenn sie passt, sonst erfinde eine kurze neue deutsche Kategorie (1-2 Wörter). "+
        "Antworte nur als JSON: {\"kategorie\":\"...\"}";
  try{
    return sampleNS.json(p,{modelTier:"quick"}).then(function(r){
      var c=r && r.kategorie;
      return (typeof c==="string" && c.length<40)?c.trim():null;
    },function(){return null;});
  }catch(e){return Promise.resolve(null);}
}

/* ---------- Hilfen ---------- */
function h(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==="class") e.className=attrs[k];
    else if(k.slice(0,2)==="on") e.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]===true) e.setAttribute(k,"");
    else if(attrs[k]!==false && attrs[k]!=null) e.setAttribute(k,attrs[k]);
  }
  (kids||[]).forEach(function(c){
    if(c==null) return;
    e.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
  });
  return e;
}
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg; t.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.hidden=true;},2200);
}
function boxById(id){return state.boxes.filter(function(b){return b.id===id;})[0];}
function boxItems(id){return state.items.filter(function(i){return i.box===id;});}
function norm(s){return s.trim().toLowerCase();}
function sortDe(a,b){return a.localeCompare(b,"de");}
function boxCats(id){
  var m={};
  boxItems(id).forEach(function(i){m[i.cat]=(m[i.cat]||0)+i.qty;});
  return Object.keys(m).sort(function(a,b){return m[b]-m[a];});
}

/* ---------- Aktionen ---------- */
function boxByName(name){return state.boxes.filter(function(b){return norm(b.name)===norm(name);})[0];}
function addItem(name,qty,boxName,cat,zug,note){
  name=name.trim(); boxName=boxName.trim();
  if(!name||!boxName) return null;
  qty=Math.max(1,parseInt(qty,10)||1);
  var box=boxByName(boxName);
  if(!box){box={id:uid(),name:boxName,place:(state.boxes.length?state.boxes[state.boxes.length-1].place:"")||"",cat:(cat||"Sonstiges").trim()};state.boxes.push(box);}

function invCounts(inv){

function invSet(id,val){

function startInv(){state.inv={id:uid(),at:Date.now(),by:myName(),res:{}};invFinish=false;save();render();}

function finishInv(apply){
  var inv=state.inv;if(!inv) return;
  var now=Date.now(),lines=[],c={ok:0,miss:0,diff:0,open:0},keep=[];
  state.items.forEach(function(it){
    var r=inv.res[it.id],bx=boxById(it.box),where=bx?bx.name:"📍 "+(it.pos||"einzeln");
    if(!r){c.open++;keep.push(it);return;}
    if(r.s==="ok"){c.ok++;it.chk=now;keep.push(it);}
    else if(r.s==="miss"){c.miss++;lines.push({n:it.name,w:where,e:it.qty,f:0});if(!apply)keep.push(it);}
    else{c.diff++;it.chk=now;lines.push({n:it.name,w:where,e:it.qty,f:r.q});if(apply){it.qty=r.q;}keep.push(it);}
  });
  var total=state.items.length;
  if(apply) state.items=keep.filter(function(i){return i.qty>0;});
  state.invHist.unshift({id:uid(),at:now,by:inv.by||myName(),ok:c.ok,miss:c.miss,diff:c.diff,open:c.open,total:total,applied:!!apply,lines:lines.slice(0,150)});
  state.invHist=state.invHist.slice(0,10);

var PALETTE=[["FFE06666","FFE6B8AF","FFDD7E6B"],["FFF9CB9C","FFFCE5CD","FFF6B26B"],["FFB6D7A8","FFD9EAD3","FF93C47D"],["FF9FC5E8","FFCFE2F3","FF6FA8DC"],["FFFFE599","FFFFF2CC","FFFFD966"],["FFB4A7D6","FFD9D2E9","FF8E7CC3"],["FF76A5AF","FFD0E0E3","FFA2C4C9"],["FFD5A6BD","FFEAD1DC","FFC27BA0"]];
function xlsxBuild(st){return xlsxZip(sheetsBestand(st));}
function sheetsBestand(st){
  var cmp=function(a,b){return String(a).localeCompare(String(b),"de");};
  var cats=[];st.boxes.forEach(function(b){var c=b.cat||"Sonstiges";if(cats.indexOf(c)<0)cats.push(c);});
  st.items.forEach(function(i){if(!i.box){var c=i.cat||"Sonstiges";if(cats.indexOf(c)<0)cats.push(c);}});
  cats.sort(cmp);
  var HDR=1;
  var rows=[],merges=[];
  var hdrRow=function(){rows.push(["Material","Anzahl","Zugang","Anmerkung","Wo?",""].map(function(t){return {t:t,s:HDR};}));};
  if(!cats.length) hdrRow();
  cats.forEach(function(c,ci){
    var p=ci%PALETTE.length, sTitle=2+p*4, sBody=3+p*4, sQty=4+p*4, sSub=5+p*4;
    hdrRow();
    rows.push([{t:c,s:sTitle},{t:"",s:sTitle},{t:"",s:sTitle},{t:"",s:sTitle},{t:"",s:sTitle},{t:"",s:sTitle}]);
    merges.push("A"+rows.length+":F"+rows.length);
    st.boxes.filter(function(b){return (b.cat||"Sonstiges")===c;}).sort(function(a,b){return cmp(a.name,b.name);}).forEach(function(b){
      rows.push([{t:b.name,s:sSub},{t:"",s:sSub},{t:"",s:sSub},{t:"",s:sSub},{t:"",s:sSub},{t:"",s:sSub}]);
      merges.push("A"+rows.length+":F"+rows.length);
      var its=st.items.filter(function(i){return i.box===b.id;}).sort(function(a,b2){return cmp(a.name,b2.name);});
      if(!its.length) its=[{name:"– leer –",qty:"",zug:"",note:""}];
      its.forEach(function(i){
        rows.push([{t:i.name,s:sBody},{t:i.qty,s:sQty},{t:i.zug||"",s:sBody},{t:i.note||"",s:sBody},{t:b.name,s:sBody},{t:b.place||"",s:sBody}]);

    if(s2>s1+0.05||(s1<MAYBE&&s2<MAYBE)){p={qty:p.alt.qty,name:p.alt.name};r=r2;}
  }
  var l={id:uid(),text:String(text).trim(),name:p.name,qty:Math.max(1,p.qty||1),entryId:null,score:0,flag:"none"};
  var top=r[0];
  if(top && top.score>=MAYBE){
    var pick=top, second=r[1];
    var ambig=second && second.score>=MAYBE && top.score-second.score<0.08;
    if(ambig && backOf(t,top.entry)>=top.entry.qty && backOf(t,second.entry)<second.entry.qty) pick=second;
    l.entryId=pick.entry.id; l.score=Math.min(1,pick.score);

}
function linkItem(name){

    if(sc>bs){bs=sc;best=it;}
  });
  return bs>=0.78?best:null;
}

}

/* ---------- Freizeit: Aktionen ---------- */
var tripId=null, addingEntryId=null;
function curTrip(){return state.trips.filter(function(t){return t.id===tripId;})[0];}
function tripStats(t){
  var packed=0,back=0,miss=0;
  t.entries.forEach(function(e){var b=backOf(t,e);packed+=e.qty;back+=Math.min(b,e.qty);miss+=Math.max(0,e.qty-b);});
  return {packed:packed,back:back,miss:miss};
}
function packAdd(t,name,qty,item){
  qty=Math.max(1,parseInt(qty,10)||1);
  name=name.trim();
  item=item||linkItem(name);
  var disp=item?item.name:name;
  var ex=t.entries.filter(function(e){return item?e.itemId===item.id:(!e.itemId&&norm(e.name)===norm(disp));})[0];
  if(ex){ex.qty+=qty;return ex;}
  var e={id:uid(),name:disp,qty:qty,itemId:item?item.id:null,manual:0};
  t.entries.push(e);
  return e;
}
function packBox(t,boxId){
  var n=0;
  boxItems(boxId).forEach(function(it){packAdd(t,it.name,it.qty,it);n++;});
  return n;
}
function setLine(t,l,entryId){
  l.entryId=entryId||null; l.flag=entryId?"user":"none"; l.score=entryId?1:0;
  if(entryId){
    var e=t.entries.filter(function(x){return x.id===entryId;})[0];
    if(e){var k=normKey(l.name),ek=normKey(e.name);if(k&&k!==ek) state.alias[k]=ek;}
  }
  save();render();
}
function deductMissing(t){
  var n=0;
  t.entries.forEach(function(e){
    var miss=Math.max(0,e.qty-backOf(t,e)), delta=miss-(e.deducted||0);
    if(delta<=0||!e.itemId) return;
    var it=itemById(e.itemId); if(!it) return;
    it.qty-=delta; e.deducted=(e.deducted||0)+delta; n+=delta;
    if(it.qty<=0) state.items=state.items.filter(function(i){return i.id!==it.id;});
  });
  confirmId=null; save(); render(); toast(n+" Stück vom Bestand abgebucht");
}

var QR_ECPB=[[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],

  for(i=0;i<deg;i++){for(j=0;j<deg;j++){r[j]=gfMul(r[j],root);if(j+1<deg)r[j]^=r[j+1];}root=gfMul(root,2);}

function qrMatrix(text){

    for(v=1;v<=40;v++){

    }
  }

function buildShareUrl(t){

  })};

  }

}

    var row=h("div",{class:"item",style:"flex-wrap:wrap"},[avatar((st.names||{})[uid]||"?",pf&&pf.photo,34),h("div",{class:"n"},[label,small?h("small",null,[small]):null])].concat(right));
    if(mgr&&role==="beobachter"&&!isOwner){
      var dsel=h("select",{style:"max-width:130px"},DURATIONS.map(function(dd){return h("option",{value:String(dd[1])},[dd[0]]);}));
      var ctl=[h("span",{class:"mute"},["Befristet bearbeiten:"]),dsel,
        h("button",{class:"ghost",onclick:function(){grantEdit(uid,Date.now()+parseInt(dsel.value,10)).then(function(){toast("Bearbeiten erlaubt");},function(){toast("Fehler");});}},["Erlauben"])];
      if(active) ctl.push(h("button",{class:"ghost danger",onclick:function(){setMemberRole(uid,"beobachter");}},["Entziehen"]));
      row.appendChild(h("div",{style:"width:100%;display:flex;gap:6px;align-items:center;flex-wrap:wrap"},ctl));
    }
    mc.appendChild(row);
  });
  c.appendChild(mc);
  if(mgr){
    var rc=h("div",{class:"card"},[h("h3",null,["Beitrittsanfragen"])]);
    if(!cloud.requests.length) rc.appendChild(h("div",{class:"mute"},["Keine offenen Anfragen."]));
    cloud.requests.forEach(function(r){
      var sel=h("select",{style:"max-width:150px"},["beobachter","wart","leitung"].map(function(x){return h("option",{value:x},[ROLE_LBL[x]]);}));
      rc.appendChild(h("div",{class:"item",style:"flex-wrap:wrap"},[h("div",{class:"n"},[r.name||"?",h("small",null,["Rolle zuweisen:"])]),sel,
        h("button",{class:"pri",style:"padding:6px 10px",onclick:function(){approveReq(r,sel.value).then(function(){toast("Freigegeben");},function(){toast("Fehler beim Freigeben");});}},["Freigeben"]),
        h("button",{class:"ghost danger",onclick:function(){stammRef().collection("joinRequests").doc(r.uid).delete();}},["Ablehnen"])]));
    });
    c.appendChild(rc);
    var ic=h("div",{class:"card"},[h("div",{class:"boxhead"},[h("h3",null,["Einladen per QR-Code"]),
      h("button",{class:"ghost",onclick:function(){cloud.inviteOpen=!cloud.inviteOpen;render();}},[cloud.inviteOpen?"Schließen":"Anzeigen"])])]);
    if(cloud.inviteOpen){
      var url=inviteUrl(),holder=h("div",{style:"max-width:280px;margin:10px auto"});
      try{holder.innerHTML=qrSvg(url);}catch(e){}
      ic.appendChild(holder);
      ic.appendChild(h("input",{value:url,readonly:true,onclick:function(e){e.target.select();}}));
      ic.appendChild(h("div",{class:"actions"},[h("button",{class:"ghost",onclick:function(){copyText(url);}},["Link kopieren"]),
        h("button",{class:"ghost danger",onclick:function(){
          if(confirmId==="code"){confirmId=null;stammRef().update({inviteCode:randCode(12)}).then(function(){toast("Neuer Code – alter Link ungültig");});}
          else{confirmId="code";render();}
        }},[confirmId==="code"?"Sicher? Alter Link wird ungültig":"Neuen Code erzeugen"])]));
      ic.appendChild(h("div",{class:"mute",style:"margin-top:8px"},["Wer scannt, meldet sich an und stellt eine Anfrage. Stammesleitung oder Materialwart geben sie oben mit einer Rolle frei."]));
    }
    c.appendChild(ic);
  }
  var lc=h("div");
  if(!cloud.log.length) lc.appendChild(h("div",{class:"mute"},["Noch keine Änderungen."]));
  cloud.log.forEach(function(l){
    var t=l.at&&l.at.toDate?l.at.toDate():(typeof l.at==="number"?new Date(l.at):null);
    var ts=t?t.toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"…";
    lc.appendChild(h("div",{class:"item"},[h("div",{class:"n"},[l.text||"",h("small",null,[(l.name||"?")+" · "+ts])])]));
  });
  c.appendChild(collCard("log","🕘 Änderungsverlauf",lc,false));
  if(mgr) c.appendChild(stammColorCard());
  var dz=h("div"),isLeitung=cloud.role==="leitung";
  dz.appendChild(h("button",{class:"ghost danger",style:"width:100%;margin-bottom:8px",onclick:function(){
    if(confirmId==="leave"){confirmId=null;leaveStamm();}else{confirmId="leave";render();}
  }},[confirmId==="leave"?"Sicher? Jetzt verlassen":"🚪 Stamm verlassen"]));
  if(isLeitung){
    dz.appendChild(h("button",{class:"ghost danger",style:"width:100%",onclick:function(){
      if(confirmId==="delst"){confirmId=null;deleteStamm();}else{confirmId="delst";render();}
    }},[confirmId==="delst"?"Sicher? Stamm + alle Daten endgültig löschen":"🗑️ Stamm löschen (Stammesleitung)"]));
    dz.appendChild(h("div",{class:"mute",style:"margin-top:6px"},["Löscht den Stamm samt Lagerdaten für alle Mitglieder. Das lässt sich nicht rückgängig machen."]));
  } else dz.appendChild(h("div",{class:"mute"},["Nur die Stammesleitung kann den Stamm löschen."]));
  c.appendChild(collCard("danger","⚠️ Verlassen & Löschen",dz,false));
  return c;
}
/*CLOUD-END*/

function dataCard(){
  var msg=h("div",{class:"mute",style:"margin-top:8px"});
  var file=h("input",{type:"file",accept:".json,application/json",style:"display:none",onchange:function(e){
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(!d||!Array.isArray(d.boxes)||!Array.isArray(d.items)) throw 0;
        state=migrate({boxes:d.boxes,items:d.items,trips:d.trips,alias:d.alias,cats:d.cats,invHist:d.invHist,inv:d.inv,updated:0}); save(); render(); toast("Backup eingespielt");
      }catch(x){msg.textContent="Datei nicht lesbar.";}
    };
    r.readAsText(f);
  }});
  return h("div",null,[
    h("h2",null,["Tabellen-Export"]),
    h("div",{class:"mute",style:"margin-bottom:8px"},["Alle Kisten und Einzel-Gegenstände nach Kategorien gruppiert (Material, Anzahl, Zugang, Anmerkung, Wo?). Gilt auch für Packliste und Inventurbericht."]),
    fmtPicker(),
    h("div",{class:"actions"},[h("button",{class:"pri",onclick:exportExcel},[prefs.fmt==="gsheets"?"🟩 Bestandsliste → Google Sheets":"📊 Bestandsliste → Excel"]),
      (state.invHist||[]).length?h("button",{class:"ghost",onclick:exportInv},["📋 Letzte Inventur"]):null]),
    h("h2",{style:"margin-top:20px"},["Daten sichern"]),
    h("div",{class:"mute"},["Die Daten liegen nur auf diesem Gerät. Mach ab und zu ein Backup."]),
    h("div",{class:"actions"},[
      h("button",{class:"pri",onclick:function(){
        var b=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
        var a=document.createElement("a"); a.href=URL.createObjectURL(b);
        a.download="lager-backup-"+new Date().toISOString().slice(0,10)+".json";
        document.body.appendChild(a); a.click(); a.remove();
      }},["Backup herunterladen"]),
      h("button",{class:"ghost",onclick:function(){file.click();}},["Backup einspielen"]),
      file
    ]),
    msg
  ]);
}
function toggleRow(key,label,sub){
  var cb=h("input",{type:"checkbox"});cb.checked=!!prefs[key];
  cb.addEventListener("change",function(){prefs[key]=cb.checked;savePrefs();if(key==="hideTrips"&&cb.checked&&tab==="freizeit")tab="lager";if(key==="hideStamm"&&cb.checked&&tab==="stamm")tab="lager";render();});
  return h("label",{class:"trow"},[cb,h("span",null,[h("b",null,[label]),h("small",null,[sub])])]);
}
function viewMehr(){
  var wrap=h("div"),name=myName();
  var pc=h("div",{class:"card"},[h("div",{style:"display:flex;gap:14px;align-items:center"},[avatar(name,myPhoto(),64),
    h("div",{style:"flex:1;min-width:0"},[h("h3",{style:"margin:0"},[cloud.user?name:"Profil"]),h("div",{class:"mute"},[cloud.user?"Das Bild sehen alle Mitglieder deines Stamms.":"Das Bild liegt nur auf diesem Gerät. Mit Konto (Tab Stamm) sehen es auch andere."])])]),
    h("div",{class:"actions"},[h("button",{class:"pri",onclick:function(){pickImage(160,savePhoto);}},[myPhoto()?"📷 Bild ändern":"📷 Profilbild wählen"]),
      myPhoto()?h("button",{class:"ghost danger",onclick:function(){savePhoto("");}},["Entfernen"]):null])]);
  wrap.appendChild(pc);
  var dc=h("div",null,[
    toggleRow("hideTrips","Tab „Freizeit“ ausblenden","Spart Platz in der unteren Leiste"),
    toggleRow("hideStamm","Tab „Stamm“ ausblenden","Konto und Stamm bleiben hier unter „Mehr“ erreichbar"),
    toggleRow("compact","Kompakte Ansicht","Kleinere Abstände, mehr Inhalt pro Bildschirm"),
    toggleRow("expand","Kisten standardmäßig aufgeklappt","Sonst siehst du nur die Kistennamen")]);
  var qa=[];
  if(prefs.hideTrips) qa.push(h("button",{class:"ghost",onclick:function(){prefs.hideTrips=false;savePrefs();tab="freizeit";render();}},["🏕️ Freizeit einblenden"]));
  if(prefs.hideStamm) qa.push(h("button",{class:"ghost",onclick:function(){prefs.hideStamm=false;savePrefs();tab="stamm";render();}},["👥 Stamm einblenden"]));
  if(qa.length) dc.appendChild(h("div",{class:"actions"},qa));
  wrap.appendChild(collCard("display","🎛️ Darstellung",dc,true));
  var colb=h("div",null,[stammTheme()&&!prefs.acc?h("div",{class:"mute",style:"margin-bottom:8px"},["Aktuell gilt die Stammesfarbe. Wähle eine eigene Farbe, um sie nur für dich zu überschreiben."]):null,
    colorPicker(prefs.acc,prefs.tint,function(c,t){prefs.acc=c;prefs.tint=t;savePrefs();render();})]);
  wrap.appendChild(collCard("mycolor","🎨 Meine Farben",colb,false));
  if(canCats()) wrap.appendChild(collCard("cats","🏷️ Kategorien verwalten",catsCard(),false));
  wrap.appendChild(collCard("data","💾 Export & Backup",dataCard(),false));
  wrap.appendChild(feedbackCard());
  return wrap;
}
var TABS=[["lager","📦","Lager"],["freizeit","🏕️","Freizeit"],["stamm","👥","Stamm"],["mehr","⚙️","Mehr"]];
function visibleTabs(){return TABS.filter(function(t){return !(t[0]==="freizeit"&&prefs.hideTrips)&&!(t[0]==="stamm"&&prefs.hideStamm);});}
var flashT=null,pageT=null;
function flash(){document.body.classList.add("anim");clearTimeout(flashT);flashT=setTimeout(function(){document.body.classList.remove("anim");},560);}
function movePill(stretch){
  var nav=document.getElementById("tabs"),pill=nav&&nav.querySelector(".pill"),on=nav&&nav.querySelector("button.on");
  if(!pill||!on)return;
  var l=on.offsetLeft,w=on.offsetWidth,l0=parseFloat(pill.getAttribute("data-l")),w0=parseFloat(pill.getAttribute("data-w"));
  if(l===l0&&w===w0)return;
  pill.setAttribute("data-l",l);pill.setAttribute("data-w",w);
  function set(a,b){pill.style.left=a+"px";pill.style.width=b+"px";}
  if(isNaN(l0)||!w0||stretch===false&&isNaN(l0)){pill.style.transition="none";set(l,w);void pill.offsetWidth;pill.style.transition="";return;}
  var L=Math.min(l0,l),R=Math.max(l0+w0,l+w);
  pill.style.transition="left .15s ease-out,width .15s ease-out";set(L,R-L);
  setTimeout(function(){pill.style.transition="";set(l,w);},140);
}
window.addEventListener("resize",function(){var p=document.querySelector("#tabs .pill");if(p){p.setAttribute("data-l","");p.setAttribute("data-w","");}movePill(false);});
document.addEventListener("click",function(e){if(e.target.closest&&e.target.closest("button,summary,label"))flash();},true);
function go(t){document.body.classList.add("page");clearTimeout(pageT);pageT=setTimeout(function(){document.body.classList.remove("page");},700);tab=normTab(t);confirmId=null;addingEntryId=null;location.hash=tab;render();}
function render(){
  var fa=document.activeElement,fid=(fa&&fa.id&&fa.id.indexOf("f-")===0)?fa.id:null,fs=fid?fa.selectionStart:null,fe=fid?fa.selectionEnd:null;
  document.body.classList.toggle("compact",!!prefs.compact);applyTheme();
  if(!visibleTabs().some(function(t){return t[0]===tab;})&&tab!=="mehr") tab="lager";
  var nav=document.getElementById("tabs"),vt=visibleTabs(),navKey=vt.map(function(t){return t[0];}).join();
  if(nav.getAttribute("data-key")!==navKey){
    nav.innerHTML="";nav.setAttribute("data-key",navKey);
    nav.appendChild(h("span",{class:"pill"}));
    vt.forEach(function(t){nav.appendChild(h("button",{"data-t":t[0],onclick:function(){go(t[0]);}},[h("span",{class:"ti"},[t[1]]),h("span",null,[t[2]])]));});
  }
  Array.prototype.forEach.call(nav.querySelectorAll("button"),function(b){b.classList.toggle("on",b.getAttribute("data-t")===tab);});
  movePill(false);
  var hd=document.getElementById("hd");hd.innerHTML="";
  hd.appendChild(h("div",{style:"flex:1;min-width:0"},[h("h1",null,[cloud.sid&&cloud.stamm?cloud.stamm.name:"Lager-Organizer"]),h("div",{class:"sub",id:"stats"})]));
  if(cloud.sid&&cloud.stamm) hd.insertBefore(iconNode(cloud.stamm.icon,40,"👥"),hd.firstChild);
  var pbtn=h("button",{class:"pbtn","aria-label":"Profil",onclick:function(){go("mehr");}},[avatar(myName(),myPhoto(),36)]);
  hd.appendChild(pbtn);
  var total=state.items.reduce(function(s,i){return s+i.qty;},0);
  document.getElementById("stats").textContent=state.boxes.length+" Kisten · "+state.items.length+" Artikel · "+total+" Stück";
  var app=document.getElementById("app"); app.innerHTML="";
  if(cloud.sid&&cloud.role&&!canEditNow()) app.appendChild(h("div",{class:"card hit"},["👁️ Beobachter – du siehst alle Änderungen live. Bearbeiten nur mit befristeter Erlaubnis von Stammesleitung oder Materialwart."]));
  if(cloud.sid&&cloud.role==="beobachter"&&canEditNow()) app.appendChild(h("div",{class:"card hit"},["✏️ Bearbeiten erlaubt bis "+fmtUntil(cloud.me.editUntil)]));
  if(cloud.sid&&cloud.loading) app.appendChild(h("div",{class:"empty"},["Stammdaten werden geladen …"]));
  if(shared||sharedErr) app.appendChild(viewShared());
  app.appendChild(tab==="freizeit"?viewTrips():tab==="stamm"?viewStamm():tab==="mehr"?viewMehr():viewLager());
  if(fid){var nn=document.getElementById(fid);if(nn&&nn!==document.activeElement){nn.focus();try{if(fs!=null)nn.setSelectionRange(fs,fe);}catch(e){}}}
}
initShare();
initJoin();
initCloud();
window.addEventListener("hashchange",function(){
  var t=normTab((location.hash||"#lager").slice(1));
  if(t!==tab){tab=t;render();}
});
render();
})();
