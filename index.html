<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lager">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#c2410c">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Lager-Organizer</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--line:#e3e1d9;--acc:#c2410c;--acc2:#fff3ea;--ok:#15803d;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#211f1d;--ink:#f1efe8;--mute:#a09d92;--line:#35332e;--acc:#fb923c;--acc2:#2c2118;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) 80px env(safe-area-inset-left)}
header{padding:18px 16px 8px;max-width:760px;margin:auto}
h1{font-size:22px;margin:0}
.sub{color:var(--mute);font-size:14px}
main{max-width:760px;margin:auto;padding:0 12px}
.tabs{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:8px 12px;z-index:5;max-width:760px;margin:auto}
.tabs{overflow-x:auto}
.tabs button{flex:1 0 auto;white-space:nowrap;padding:10px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h2,.card h3{margin:0 0 8px;font-size:17px}
form.add{display:grid;gap:8px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:2px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;min-width:0}
.row{display:grid;grid-template-columns:90px 1fr;gap:8px}
button.pri{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
button.ghost.danger{color:var(--bad)}
.chip{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:99px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0;font-weight:600}
.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .n{flex:1;min-width:0}
.item .n small{display:block;color:var(--mute);font-size:12px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;line-height:1;cursor:pointer}
.qty b{min-width:26px;text-align:center}
.boxhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mute{color:var(--mute);font-size:13px}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:10;max-width:90vw}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ok{color:var(--ok);font-weight:600}.warn{color:#d97706;font-weight:600}.bad{color:var(--bad);font-weight:600}
textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;min-height:96px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:var(--ok)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.hit{background:var(--acc2)}
</style>
</head>
<body>
<header>
  <h1>📦 Lager-Organizer</h1>
  <div class="sub" id="stats"></div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>

<script id="data" type="application/json">{"boxes":[],"items":[],"updated":0}</script>
<script>
(function(){
"use strict";

/* ---------- Zustand ---------- */
var LS="lager-organizer-v1";
var state=migrate(load());
var tab=(location.hash||"#add").slice(1);
if(["add","kisten","kategorien","suche","freizeit","daten"].indexOf(tab)<0) tab="add";
var query="";
var confirmId=null;

function load(){
  var emb={boxes:[],items:[],updated:0};
  try{emb=JSON.parse(document.getElementById("data").textContent);}catch(e){}
  try{
    var l=JSON.parse(localStorage.getItem(LS)||"null");
    if(l && l.updated>(emb.updated||0)) return l;
  }catch(e){}
  return emb;
}
function migrate(st){
  if(!Array.isArray(st.trips)) st.trips=[];
  if(!st.alias||typeof st.alias!=="object") st.alias={};
  st.boxes.forEach(function(b){
    if(!b.cat){
      var m={},best="Sonstiges",bq=-1;
      st.items.forEach(function(i){if(i.box===b.id){var c=i.cat||"Sonstiges";m[c]=(m[c]||0)+i.qty;}});
      Object.keys(m).forEach(function(c){if(m[c]>bq){bq=m[c];best=c;}});
      b.cat=best;
    }
  });
  st.items.forEach(function(i){
    var b=st.boxes.filter(function(x){return x.id===i.box;})[0];
    if(b) i.cat=b.cat;
  });
  return st;
}
function uid(){return Math.random().toString(36).slice(2,9);}

/* ---------- Speichern ---------- */
var pubTimer=null, artifactNS=null, dirty=false;
claude_init();
function claude_init(){
  try{
    if(window.claude && window.claude.use){
      window.claude.use("artifact").then(function(a){artifactNS=a||null;},function(){});
      window.claude.use("sample").then(function(s){sampleNS=s||null;},function(){});
    }
  }catch(e){}
}
var sampleNS=null;
function save(){
  migrate(state);
  state.updated=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
  dirty=true;
  schedulePublish();
}
function schedulePublish(){
  if(!artifactNS) return;
  clearTimeout(pubTimer);
  pubTimer=setTimeout(doPublish,3000);
}
function doPublish(){
  if(!artifactNS||!dirty) return;
  var ae=document.activeElement;
  if(ae && (ae.tagName==="INPUT"||ae.tagName==="SELECT")){schedulePublish();return;}
  dirty=false;
  var clone=document.documentElement.cloneNode(true);
  clone.querySelector("#app").innerHTML="";
  clone.querySelector("#tabs").innerHTML="";
  clone.querySelector("#stats").textContent="";
  var t=clone.querySelector("#toast"); t.hidden=true; t.textContent="";
  clone.querySelector("#data").textContent=JSON.stringify(state).replace(/</g,"\\u003c");
  var html="<!DOCTYPE html>\n"+clone.outerHTML;
  artifactNS.publish(html).then(function(){},function(e){});
}

/* ---------- Kategorien automatisch ---------- */
var RULES=[
 ["Spiele",["spielekiste","spiele","kendama","frisbee","badminton","slackline","wikinger"]],
 ["Feuer",["feuer","magnesium","zunder"]],
 ["Werkzeug",["hammer","schraub","bohr","säge","zange","werkzeug","schlüssel","wasserwaage","akku","nägel","dübel","schrauben","feile","meißel","zollstock"]],
 ["Kabel & Zubehör",["kabel","ladegerät","netzteil","adapter","stecker","verlängerung","steckdose","usb","hdmi","batterie"]],
 ["Elektronik",["laptop","computer","monitor","tastatur","maus","handy","tablet","kamera","lautsprecher","radio","router","drucker","fernseher","konsole","kopfhörer","lampe","glühbirne","led"]],
 ["Kleidung",["hose","shirt","t-shirt","pullover","jacke","mantel","schuh","socke","kleid","mütze","schal","handschuh","hemd","jeans","stiefel","unterwäsche"]],
 ["Bettwäsche & Textilien",["bettwäsche","decke","kissen","handtuch","vorhang","laken","teppich","stoff","matratze"]],
 ["Küche & Haushalt",["küche","dutch","teller","tasse","glas","topf","pfanne","besteck","messer","gabel","löffel","schüssel","kaffee","mixer","toaster","backform","vase","kerze","putz","reiniger","schwamm","eimer"]],
 ["Bücher & Papier",["buch","bücher","ordner","zeitschrift","heft","akte","dokument","unterlagen","papier","album","foto","comic","roman"]],
 ["Büro",["stift","kugelschreiber","tacker","locher","büro","umschlag","klebeband","schere","notizbuch","etikett"]],
 ["Medien",["cd","dvd","blu-ray","schallplatte","vinyl","kassette","spiel","videospiel"]],
 ["Spielzeug",["spielzeug","lego","puppe","teddy","puzzle","brettspiel","kuscheltier","auto","playmobil","bauklötze"]],
 ["Sport & Freizeit",["ball","fahrrad","helm","ski","hantel","yoga","schläger","rucksack","skateboard","inliner","schlittschuh","angel"]],
 ["Camping & Outdoor",["zelt","schlafsack","campingkocher","isomatte","laterne","wanderstock","grill"]],
 ["Garten",["gartenschlauch","blumentopf","erde","dünger","samen","gieß","rasen","harke","spaten","schaufel","pflanze","blumen"]],
 ["Deko & Saison",["weihnacht","deko","christbaum","lichterkette","kugel","ostern","halloween","bilderrahmen","rahmen"]],
 ["Bad & Hygiene",["shampoo","seife","zahn","rasier","handtuch","duschgel","creme","bad","föhn"]],
 ["Farben & Renovierung",["farbe","pinsel","rolle","tapete","kleber","lack","spachtel","abdeck","silikon"]],
 ["Auto & Fahrrad",["reifen","öl","scheibenwischer","fahrradpumpe","kettenöl","felge","kfz"]],
 ["Lebensmittel",["konserve","nudeln","reis","mehl","zucker","vorrat","dose","getränk","wasser"]]
];
function guessCategory(name){
  var n=name.toLowerCase();
  for(var i=0;i<RULES.length;i++){
    var kws=RULES[i][1];
    for(var j=0;j<kws.length;j++){ if(n.indexOf(kws[j])>=0) return RULES[i][0]; }
  }
  return null;
}
function allCategories(){
  var s={};
  state.items.forEach(function(i){s[i.cat]=1;});
  state.boxes.forEach(function(b){if(b.cat)s[b.cat]=1;});
  RULES.forEach(function(r){s[r[0]]=1;});
  s["Sonstiges"]=1;
  return Object.keys(s).sort(function(a,b){return a.localeCompare(b,"de");});
}
function aiCategory(name){
  if(!sampleNS) return Promise.resolve(null);
  var cats=allCategories().join(", ");
  var p="Ordne eine Lagerkiste einer Kategorie zu. Kiste und erster Inhalt: "+name+". Bestehende Kategorien: "+cats+". "+
        "Nimm eine bestehende, wenn sie passt, sonst erfinde eine kurze neue deutsche Kategorie (1-2 Wörter). "+
        "Antworte nur als JSON: {\"kategorie\":\"...\"}";
  try{
    return sampleNS.json(p,{modelTier:"quick"}).then(function(r){
      var c=r && r.kategorie;
      return (typeof c==="string" && c.length<40)?c.trim():null;
    },function(){return null;});
  }catch(e){return Promise.resolve(null);}
}

/* ---------- Hilfen ---------- */
function h(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==="class") e.className=attrs[k];
    else if(k.slice(0,2)==="on") e.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]===true) e.setAttribute(k,"");
    else if(attrs[k]!==false && attrs[k]!=null) e.setAttribute(k,attrs[k]);
  }
  (kids||[]).forEach(function(c){
    if(c==null) return;
    e.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
  });
  return e;
}
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg; t.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.hidden=true;},2200);
}
function boxById(id){return state.boxes.filter(function(b){return b.id===id;})[0];}
function boxItems(id){return state.items.filter(function(i){return i.box===id;});}
function norm(s){return s.trim().toLowerCase();}
function sortDe(a,b){return a.localeCompare(b,"de");}
function boxCats(id){
  var m={};
  boxItems(id).forEach(function(i){m[i.cat]=(m[i.cat]||0)+i.qty;});
  return Object.keys(m).sort(function(a,b){return m[b]-m[a];});
}

/* ---------- Aktionen ---------- */
function boxByName(name){return state.boxes.filter(function(b){return norm(b.name)===norm(name);})[0];}
function addItem(name,qty,boxName,cat,zug,note){
  name=name.trim(); boxName=boxName.trim();
  if(!name||!boxName) return null;
  qty=Math.max(1,parseInt(qty,10)||1);
  var box=boxByName(boxName);
  if(!box){box={id:uid(),name:boxName,place:(state.boxes.length?state.boxes[state.boxes.length-1].place:"")||"",cat:(cat||"Sonstiges").trim()};state.boxes.push(box);}
  zug=(zug||"").trim(); note=(note||"").trim();
  var ex=state.items.filter(function(i){return i.box===box.id && norm(i.name)===norm(name);})[0];
  if(ex){ex.qty+=qty; if(zug&&!ex.zug)ex.zug=zug; if(note&&!ex.note)ex.note=note; ex.cat=box.cat; return ex;}
  var it={id:uid(),name:name,qty:qty,box:box.id,cat:box.cat,zug:zug,note:note};
  state.items.push(it);
  return it;
}
function changeQty(id,d){
  var it=state.items.filter(function(i){return i.id===id;})[0];
  if(!it) return;
  it.qty+=d;
  if(it.qty<=0) state.items=state.items.filter(function(i){return i.id!==id;});
  save(); render();
}
function removeItem(id){
  state.items=state.items.filter(function(i){return i.id!==id;});
  save(); render();
}
function removeBox(id){
  state.boxes=state.boxes.filter(function(b){return b.id!==id;});
  state.items=state.items.filter(function(i){return i.box!==id;});
  confirmId=null; save(); render();
}
function renameBox(b){
  var v=window.prompt?null:null; /* prompt ist im Frame gesperrt – inline Bearbeitung */
}

/* ---------- Ansichten ---------- */
function viewAdd(){
  var wrap=h("div");
  var nameIn=h("input",{id:"f-name",placeholder:"z. B. Spülbürsten",autocomplete:"off",required:true});
  var qtyIn=h("input",{id:"f-qty",type:"number",min:"1",value:"1",inputmode:"numeric"});
  var boxIn=h("input",{id:"f-box",placeholder:"z. B. Küchenkiste 1",list:"boxlist",autocomplete:"off",required:true});
  var dl=h("datalist",{id:"boxlist"},state.boxes.slice().sort(function(a,b){return sortDe(a.name,b.name);}).map(function(b){return h("option",{value:b.name});}));
  var catIn=h("select",{id:"f-cat"},[h("option",{value:""},["Automatisch erkennen"])].concat(allCategories().map(function(c){return h("option",{value:c},[c]);})));
  var zugIn=h("input",{id:"f-zug",placeholder:"z. B. Bestand 2020",autocomplete:"off"});
  var noteIn=h("input",{id:"f-note",placeholder:"optional",autocomplete:"off"});
  var hint=h("div",{class:"mute"});
  function updHint(){
    var b=boxByName(boxIn.value||"");
    if(b){hint.textContent="Kiste „"+b.name+"“ gehört zur Kategorie „"+b.cat+"“ – alles darin bekommt sie automatisch.";catIn.disabled=true;}
    else{hint.textContent=boxIn.value.trim()?"Neue Kiste: Die Kategorie gilt für den gesamten Inhalt der Kiste.":"Die Kategorie gilt immer für die ganze Kiste.";catIn.disabled=false;}
  }
  boxIn.addEventListener("input",updHint); updHint();
  var btn=h("button",{class:"pri",type:"submit"},["Einlagern"]);
  var form=h("form",{class:"add"},[
    h("div",{class:"row"},[h("div",null,[h("label",null,["Anzahl"]),qtyIn]),h("div",null,[h("label",null,["Objekt"]),nameIn])]),
    h("div",null,[h("label",null,["In welcher Kiste?"]),boxIn,dl]),
    h("div",null,[h("label",null,["Kategorie der Kiste"]),catIn,hint]),
    h("div",{class:"row2",style:"margin-top:0"},[h("div",null,[h("label",null,["Zugang"]),zugIn]),h("div",null,[h("label",null,["Anmerkung"]),noteIn])]),
    btn
  ]);
  form.addEventListener("submit",function(ev){
    ev.preventDefault();
    var name=nameIn.value, qty=qtyIn.value, boxName=boxIn.value.trim(), cat=catIn.value, zug=zugIn.value, note=noteIn.value;
    if(!name.trim()||!boxName) return;
    function finish(c){
      var it=addItem(name,qty,boxName,c,zug,note);
      save();
      toast("✓ "+it.qty+"× "+it.name+" → "+boxName+" ("+it.cat+")");
      render();
      setTimeout(function(){
        var b=document.getElementById("f-box"); if(b){b.value=boxName;b.dispatchEvent(new Event("input"));}
        var n=document.getElementById("f-name"); if(n) n.focus();
      },0);
    }
    if(boxByName(boxName)) return finish(null);
    if(cat) return finish(cat);
    var g=guessCategory(boxName)||guessCategory(name);
    if(g) return finish(g);
    btn.disabled=true; btn.textContent="Kategorie wird ermittelt …";
    aiCategory("„"+boxName+"“ mit „"+name+"“").then(function(c){finish(c||"Sonstiges");});
  });
  wrap.appendChild(h("div",{class:"card"},[h("h2",null,["Gegenstand einlagern"]),form]));
  var recent=state.items.slice(-5).reverse();
  if(recent.length){
    wrap.appendChild(h("div",{class:"card"},[h("h3",null,["Zuletzt hinzugefügt"])].concat(recent.map(function(i){
      var b=boxById(i.box);
      return h("div",{class:"item"},[h("div",{class:"n"},[i.qty+"× "+i.name,h("small",null,[(b?b.name:"?")+" · "+i.cat])])]);
    }))));
  }
  return wrap;
}

function itemRow(i,showBox){
  var b=boxById(i.box);
  var isConf=confirmId===i.id;
  return h("div",{class:"item"},[
    h("div",{class:"n"},[i.name,(function(){var t=showBox?((b?b.name:"?")+" · "+i.cat):[i.zug,i.note].filter(Boolean).join(" · ");return t?h("small",null,[t]):null;})()]),
    h("div",{class:"qty"},[
      h("button",{"aria-label":"weniger",onclick:function(){changeQty(i.id,-1);}},["−"]),
      h("b",null,[i.qty]),
      h("button",{"aria-label":"mehr",onclick:function(){changeQty(i.id,1);}},["+"])
    ]),
    h("button",{class:"ghost danger",onclick:function(){
      if(isConf){removeItem(i.id);} else {confirmId=i.id; render();}
    }},[isConf?"Sicher?":"✕"])
  ]);
}

function viewBoxes(){
  var wrap=h("div");
  if(!state.boxes.length){wrap.appendChild(h("div",{class:"empty"},["Noch keine Kisten. Lagere zuerst einen Gegenstand ein."]));return wrap;}
  wrap.appendChild(h("div",{class:"actions",style:"margin:10px 0"},[h("button",{class:"pri",onclick:exportExcel},["📊 Alles nach Excel exportieren"])]));
  wrap.appendChild(h("datalist",{id:"catlist"},allCategories().map(function(c){return h("option",{value:c});})));
  state.boxes.slice().sort(function(a,b){return sortDe(a.name,b.name);}).forEach(function(b){
    var its=boxItems(b.id).sort(function(x,y){return sortDe(x.name,y.name);});
    var total=its.reduce(function(s,i){return s+i.qty;},0);
    var isConf=confirmId===b.id;
    var placeIn=h("input",{value:b.place||"",placeholder:"Ort (z. B. Lager)",
      onchange:function(e){b.place=e.target.value.trim();save();}});
    var catEdit=h("input",{value:b.cat||"",list:"catlist",placeholder:"Kategorie",
      onchange:function(e){var v=e.target.value.trim();if(v){b.cat=v;save();}render();}});
    var card=h("div",{class:"card"},[
      h("div",{class:"boxhead"},[
        h("div",null,[h("h3",null,["📦 "+b.name]),h("div",{class:"mute"},[its.length+" Artikel · "+total+" Stück"])]),
        h("button",{class:"ghost danger",onclick:function(){if(isConf){removeBox(b.id);}else{confirmId=b.id;render();}}},[isConf?"Kiste + Inhalt löschen?":"Löschen"])
      ]),
      h("div",{class:"row2"},[h("div",null,[h("label",null,["Kategorie"]),catEdit]),h("div",null,[h("label",null,["Ort"]),placeIn])])
    ].concat(its.length?its.map(function(i){return itemRow(i,false);}):[h("div",{class:"mute",style:"padding:10px 0"},["Leer"])]));
    wrap.appendChild(card);
  });
  return wrap;
}

function viewCats(){
  var wrap=h("div");
  var map={};
  state.items.forEach(function(i){(map[i.cat]=map[i.cat]||[]).push(i);});
  var cats=Object.keys(map).sort(sortDe);
  if(!cats.length){wrap.appendChild(h("div",{class:"empty"},["Noch keine Kategorien. Sie entstehen automatisch beim Einlagern."]));return wrap;}
  cats.forEach(function(c){
    var its=map[c].sort(function(a,b){return sortDe(a.name,b.name);});
    var total=its.reduce(function(s,i){return s+i.qty;},0);
    var boxes={};its.forEach(function(i){var b=boxById(i.box);if(b)boxes[b.name]=1;});
    wrap.appendChild(h("div",{class:"card"},[
      h("h3",null,[c]),
      h("div",{class:"mute"},[its.length+" Artikel · "+total+" Stück · in "+Object.keys(boxes).sort(sortDe).join(", ")])
    ].concat(its.map(function(i){
      var b=boxById(i.box);
      return h("div",{class:"item"},[h("div",{class:"n"},[i.qty+"× "+i.name,h("small",null,["📦 "+(b?b.name:"?")])])]);
    }))));
  });
  return wrap;
}

function viewSearch(){
  var wrap=h("div");

function renderResults(){
  var res=document.getElementById("results"); if(!res) return;

    var b=boxById(i.box);
    return norm(i.name).indexOf(q)>=0||norm(i.cat).indexOf(q)>=0||(b&&norm(b.name).indexOf(q)>=0);
  }).sort(function(a,b){return sortDe(a.name,b.name);});

var STOP={"der":1,"die":1,"das":1,"und":1,"mit":1,"fur":1,"von":1,"in":1,"im":1,"aus":1,"zum":1,"zur":1,"ein":1,"eine":1,"div":1,"diverse":1,"etc":1,"ca":1,"stk":1,"stuck":1,"st":1};
function fold(s){return String(s).toLowerCase().replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss").replace(/[éèê]/g,"e").replace(/ae/g,"a").replace(/oe/g,"o").replace(/ue/g,"u");}
function stem(t){
  if(/^\d+$/.test(t)||t.length<5) return t;
  var suf=["innen","ern","en","er","e","n","s"];
  for(var i=0;i<suf.length;i++){
    if(t.slice(-suf[i].length)===suf[i] && t.length-suf[i].length>=3) return t.slice(0,-suf[i].length);
  }
  return t;
}
function tokens(str){
  var out=[],re=/\(([^)]*)\)|([^()]+)/g,m;
  str=String(str);
  while((m=re.exec(str))){
    var inner=m[1]!==undefined, txt=inner?m[1]:m[2], w=inner?0.4:1;
    fold(txt).split(/[^a-z0-9]+/).forEach(function(t){
      if(!t||STOP[t]) return;
      out.push({t:stem(t),w:w});
    });
  }
  return out;
}
var SYN={};
[["wimpel","fahne","flagge","banner"],["eimer","kubel"],["laterne","lampe","leuchte","licht"],["seil","schnur","leine","tau"],
 ["schlager","racket"],["feuerschale","feuerkorb"],["topf","kochtopf"],["pfanne","bratpfanne"],["messer","kuechenmesser"],

function lev(a,b){
  var m=a.length,n=b.length,p=[],i,j;
  for(j=0;j<=n;j++)p[j]=j;
  for(i=1;i<=m;i++){
    var prev=p[0];p[0]=i;
    for(j=1;j<=n;j++){
      var tmp=p[j];
      p[j]=Math.min(p[j]+1,p[j-1]+1,prev+(a.charAt(i-1)===b.charAt(j-1)?0:1));
      prev=tmp;
    }
  }

}
function tokSim(a,b){
  if(a===b) return 1;
  if(SYN[a]!==undefined && SYN[a]===SYN[b]) return 0.95;
  if(/^\d+$/.test(a)||/^\d+$/.test(b)) return 0;
  var sh=a.length<b.length?a:b, lo=a.length<b.length?b:a;

function makeLine(t,text){

    var s1=r[0]?r[0].score:0, s2=r2[0]?r2[0].score:0;

  t.entries.forEach(function(e){
    var miss=Math.max(0,e.qty-backOf(t,e)), delta=miss-(e.deducted||0);
    if(delta<=0||!e.itemId) return;
    var it=itemById(e.itemId); if(!it) return;
    it.qty-=delta; e.deducted=(e.deducted||0)+delta; n+=delta;
    if(it.qty<=0) state.items=state.items.filter(function(i){return i.id!==it.id;});
  });
  confirmId=null; save(); render(); toast(n+" Stück vom Bestand abgebucht");
}

/* ---------- Freizeit: Ansichten ---------- */
var STATUS_LBL={pack:"Packliste",back:"Rückgabe",done:"Abgeschlossen"};
function viewTrips(){
  var t=curTrip();
  if(!t) return viewTripList();
  return t.status==="pack"?viewPack(t):viewBack(t);
}
function viewTripList(){
  var wrap=h("div");
  var nameIn=h("input",{placeholder:"z. B. Sommerlager 2027",required:true});
  var dateIn=h("input",{type:"date"});
  var form=h("form",{class:"add"},[
    h("div",null,[h("label",null,["Name der Freizeit"]),nameIn]),
    h("div",null,[h("label",null,["Datum (optional)"]),dateIn]),
    h("button",{class:"pri",type:"submit"},["Packliste anlegen"])
  ]);
  form.addEventListener("submit",function(ev){
    ev.preventDefault();
    if(!nameIn.value.trim()) return;
    var t={id:uid(),name:nameIn.value.trim(),date:dateIn.value||"",status:"pack",entries:[],lines:[]};
    state.trips.push(t); tripId=t.id; save(); render();
  });
  wrap.appendChild(h("div",{class:"card"},[h("h2",null,["Neue Freizeit"]),form]));
  if(!state.trips.length){wrap.appendChild(h("div",{class:"empty"},["Noch keine Freizeit. Lege oben eine Packliste an."]));return wrap;}
  state.trips.slice().reverse().forEach(function(t){
    var st=tripStats(t), isConf=confirmId===t.id;
    var info=t.entries.length+" Positionen · "+st.packed+" Stück";
    if(t.status!=="pack") info+=" · "+(st.miss?st.miss+" fehlen":"vollständig");
    wrap.appendChild(h("div",{class:"card"},[
      h("div",{class:"boxhead"},[
        h("div",null,[h("h3",null,["🏕️ "+t.name]),h("div",{class:"mute"},[(t.date?t.date+" · ":"")+STATUS_LBL[t.status]+" · "+info])]),
        h("button",{class:"ghost danger",onclick:function(){
          if(isConf){state.trips=state.trips.filter(function(x){return x.id!==t.id;});confirmId=null;save();render();}
          else{confirmId=t.id;render();}
        }},[isConf?"Sicher?":"✕"])
      ]),
      h("div",{class:"actions"},[h("button",{class:"pri",onclick:function(){tripId=t.id;render();}},["Öffnen"])])
    ]));
  });
  return wrap;
}
function backBtn(){return h("button",{class:"ghost",onclick:function(){tripId=null;addingEntryId=null;render();}},["← Alle Freizeiten"]);}

function viewPack(t){
  var wrap=h("div");
  wrap.appendChild(backBtn());
  var seen={},names=[];
  state.items.forEach(function(i){if(!seen[norm(i.name)]){seen[norm(i.name)]=1;names.push(i.name);}});
  names.sort(sortDe);
  var nameIn=h("input",{id:"p-name",list:"itemnames",placeholder:"Material (aus dem Lager oder neu)",autocomplete:"off"});
  var qtyIn=h("input",{type:"number",min:"1",value:"1",inputmode:"numeric"});
  var dl=h("datalist",{id:"itemnames"},names.map(function(n){return h("option",{value:n});}));
  var form=h("form",{class:"add"},[
    h("div",{class:"row"},[h("div",null,[h("label",null,["Anzahl"]),qtyIn]),h("div",null,[h("label",null,["Material"]),nameIn,dl])]),
    h("button",{class:"pri",type:"submit"},["Zur Packliste"])
  ]);
  form.addEventListener("submit",function(ev){
    ev.preventDefault();
    var n=nameIn.value.trim(); if(!n) return;
    var e=packAdd(t,n,qtyIn.value);
    save(); toast("✓ "+e.name+(e.itemId?" (aus dem Lager)":" (nicht im Lager erfasst)"));
    render(); setTimeout(function(){var x=document.getElementById("p-name");if(x)x.focus();},0);
  });
  var boxSel=h("select",null,[h("option",{value:""},["Ganze Kiste mitnehmen …"])].concat(
    state.boxes.slice().sort(function(a,b){return sortDe(a.name,b.name);}).map(function(b){return h("option",{value:b.id},[b.name+" ("+boxItems(b.id).length+")"]);})));
  wrap.appendChild(h("div",{class:"card"},[
    h("h2",null,["🏕️ "+t.name]),
    h("div",{class:"mute",style:"margin-bottom:8px"},["Packliste: Was kommt mit?"]),
    form,
    h("div",{class:"actions"},[boxSel,h("button",{class:"ghost",onclick:function(){
      if(!boxSel.value) return;
      var n=packBox(t,boxSel.value); save(); toast(n+" Positionen hinzugefügt"); render();
    }},["Einpacken"])])
  ]));
  if(!t.entries.length){wrap.appendChild(h("div",{class:"empty"},["Die Packliste ist noch leer."]));return wrap;}
  var card=h("div",{class:"card"},[h("h3",null,["Packliste ("+t.entries.length+")"])]);
  t.entries.forEach(function(e){
    var it=e.itemId?itemById(e.itemId):null, b=it?boxById(it.box):null;
    var small;
    if(it){
      small=h("small",null,["📦 "+(b?b.name:"?")+" · im Lager: "+it.qty+" ",e.qty>it.qty?h("span",{class:"warn"},["⚠ zu wenig"]):null]);
    } else small=h("small",null,[h("span",{class:"warn"},["nicht im Lager erfasst"])]);
    card.appendChild(h("div",{class:"item"},[
      h("div",{class:"n"},[e.name,small]),
      h("div",{class:"qty"},[
        h("button",{onclick:function(){e.qty-=1;if(e.qty<=0)t.entries=t.entries.filter(function(x){return x.id!==e.id;});save();render();}},["−"]),
        h("b",null,[e.qty]),
        h("button",{onclick:function(){e.qty+=1;save();render();}},["+"])
      ]),
      h("button",{class:"ghost danger",onclick:function(){t.entries=t.entries.filter(function(x){return x.id!==e.id;});save();render();}},["✕"])
    ]));
  });
  wrap.appendChild(card);
  wrap.appendChild(h("button",{class:"pri",style:"width:100%;margin-top:8px",onclick:function(){t.status="back";save();render();}},["Packliste fertig → Rückgabe starten"]));
  return wrap;
}

function flagBadge(l){
  var pct=Math.round(l.score*100)+"%";
  if(l.flag==="user") return h("span",{class:"ok"},["✓ bestätigt"]);
  if(l.flag==="") return h("span",{class:"ok"},["✓ erkannt ("+pct+")"]);
  if(l.flag==="none") return h("span",{class:"bad"},["✗ keine Zuordnung"]);
  return h("span",{class:"warn"},["⚠ bitte prüfen ("+pct+")"+(l.flag==="ambig"?" · mehrdeutig":"")]);
}

function viewBack(t){
  var ro=t.status==="done";
  var wrap=h("div");
  wrap.appendChild(backBtn());
  var st=tripStats(t), pct=st.packed?Math.round(st.back/st.packed*100):0;
  wrap.appendChild(h("div",{class:"card"},[
    h("h2",null,["🏕️ "+t.name+(ro?" (abgeschlossen)":"")]),
    h("div",null,[st.back+" von "+st.packed+" Stück zurück · ",st.miss?h("span",{class:"bad"},[st.miss+" fehlen"]):h("span",{class:"ok"},["alles da ✓"])]),
    h("div",{class:"bar"},[h("i",{style:"width:"+pct+"%"})])
  ]));

  if(!ro){
    var ta=h("textarea",{placeholder:"Eine Zeile pro Material, z. B.\n3x Bälle\nWasserkanister 7\nFlaggen"});
    var btn=h("button",{class:"pri"},["Zuordnen"]);
    btn.addEventListener("click",function(){
      var parts=ta.value.split(/\n|;/),n=0,check=0;
      parts.forEach(function(p){var l=makeLine(t,p);if(l){t.lines.push(l);n++;if(l.flag!==""&&l.flag!=="user")check++;}});
      if(!n) return;
      save(); render(); toast(n+" Zeilen zugeordnet"+(check?" – "+check+" bitte prüfen":""));
    });
    wrap.appendChild(h("div",{class:"card"},[
      h("h3",null,["Rückgabe eintippen"]),
      h("div",{class:"mute",style:"margin-bottom:8px"},["Auch bei anderen Bezeichnungen (z. B. „Flaggen“ statt „Fahnen“) wird das passende Material erkannt."]),
      ta,h("div",{class:"actions"},[btn])
    ]));
  }

  if(t.lines.length){
    var lc=h("div",{class:"card"},[h("h3",null,["Zuordnung der Eingaben"])]);
    t.lines.forEach(function(l){
      var sel=h("select",{disabled:ro,style:"max-width:46%"},[h("option",{value:""},["– nicht zugeordnet –"])].concat(
        t.entries.map(function(e){return h("option",{value:e.id,selected:l.entryId===e.id},[e.name]);})));
      sel.addEventListener("change",function(){setLine(t,l,sel.value);});
      var extra=[];
      if(!ro&&!l.entryId) extra.push(h("button",{class:"ghost",onclick:function(){
        var e={id:uid(),name:l.name,qty:0,itemId:null,manual:0};
        var it=linkItem(l.name); if(it){e.itemId=it.id;e.name=it.name;}
        t.entries.push(e); setLine(t,l,e.id);
      }},["+ Zusätzliches Material"]));
      lc.appendChild(h("div",{class:"item",style:"flex-wrap:wrap"},[
        h("div",{class:"n"},[l.qty+"× "+l.name,h("small",null,[flagBadge(l)])]),
        sel,
        ro?null:h("button",{class:"ghost danger",onclick:function(){t.lines=t.lines.filter(function(x){return x.id!==l.id;});save();render();}},["✕"]),
        extra.length?h("div",{style:"width:100%"},extra):null
      ]));
    });
    wrap.appendChild(lc);
  }

  var ec=h("div",{class:"card"},[h("h3",null,["Packliste – Rückgabe"])]);
  if(!ro&&st.miss) ec.appendChild(h("div",{class:"actions",style:"margin:0 0 6px"},[h("button",{class:"ghost",onclick:function(){
    t.entries.forEach(function(e){var m=e.qty-backOf(t,e);if(m>0)e.manual=(e.manual||0)+m;});save();render();
  }},["Alles vollständig zurück"])]));
  t.entries.forEach(function(e){
    var b=backOf(t,e), miss=Math.max(0,e.qty-b), extra=Math.max(0,b-e.qty);
    var badge=e.qty===0?h("span",{class:"warn"},["zusätzlich"]):miss?h("span",{class:"bad"},["fehlt: "+miss]):extra?h("span",{class:"warn"},["+"+extra+" mehr"]):h("span",{class:"ok"},["✓ vollständig"]);
    ec.appendChild(h("div",{class:"item"},[
      h("div",{class:"n"},[e.name,h("small",null,["mit: "+e.qty+" · zurück: "+b+" · ",badge])]),
      ro?null:h("div",{class:"qty"},[
        h("button",{onclick:function(){if((e.manual||0)>0){e.manual--;save();render();}}},["−"]),
        h("b",null,[b]),
        h("button",{onclick:function(){e.manual=(e.manual||0)+1;save();render();}},["+"])
      ])
    ]));
  });
  wrap.appendChild(ec);

  /* Wieder ins Lager */
  var groups={},order=[];
  t.entries.forEach(function(e){
    var b=backOf(t,e); if(b<=0) return;
    var it=e.itemId?itemById(e.itemId):null, bx=it?boxById(it.box):null;
    var label=bx?("📦 "+bx.name+(bx.place?" ("+bx.place+")":"")):"Nicht im Lager erfasst";
    if(!groups[label]){groups[label]=[];order.push(label);}
    groups[label].push({e:e,b:b,known:!!bx});
  });
  var pc=h("div",{class:"card"},[h("h3",null,["Wieder ins Lager"])]);
  if(!order.length) pc.appendChild(h("div",{class:"mute"},["Noch nichts zurück."]));
  order.sort(sortDe).forEach(function(label){
    pc.appendChild(h("div",{class:"mute",style:"margin-top:8px;font-weight:600"},[label]));
    groups[label].forEach(function(r){
      var row=[h("div",{class:"n"},[r.b+"× "+r.e.name])];
      if(!r.known&&!ro){
        if(addingEntryId===r.e.id){
          var bi=h("input",{placeholder:"In welche Kiste?",list:"tbox",style:"max-width:50%"});
          row.push(bi,h("datalist",{id:"tbox"},state.boxes.map(function(b){return h("option",{value:b.name});})),
            h("button",{class:"ghost",onclick:function(){
              var bn=bi.value.trim(); if(!bn) return;
              var cat=guessCategory(bn)||guessCategory(r.e.name)||"Sonstiges";
              var it=addItem(r.e.name,r.b,bn,cat,"","");
              r.e.itemId=it.id; addingEntryId=null; save(); render(); toast("✓ ins Lager aufgenommen: "+bn);
            }},["OK"]));
        } else row.push(h("button",{class:"ghost",onclick:function(){addingEntryId=r.e.id;render();}},["Ins Lager aufnehmen"]));
      }
      pc.appendChild(h("div",{class:"item"},row));
    });
  });
  wrap.appendChild(pc);

  /* Fehlt */
  var missing=t.entries.filter(function(e){return e.qty>backOf(t,e);});
  var mc=h("div",{class:"card"},[h("h3",null,["Es fehlt"])]);
  if(!missing.length) mc.appendChild(h("div",{class:"ok"},["Nichts fehlt 🎉"]));
  var txt=[];
  missing.forEach(function(e){
    var m=e.qty-backOf(t,e), it=e.itemId?itemById(e.itemId):null, bx=it?boxById(it.box):null;
    txt.push("- "+m+"× "+e.name+(bx?" ("+bx.name+")":""));
    mc.appendChild(h("div",{class:"item"},[h("div",{class:"n"},[m+"× "+e.name,bx?h("small",null,["gehört in 📦 "+bx.name]):null])]));
  });
  if(missing.length){
    var acts=[h("button",{class:"ghost",onclick:function(){copyText(t.name+" – es fehlt:\n"+txt.join("\n"));}},["Fehlliste kopieren"])];
    var linkedMiss=missing.some(function(e){return e.itemId&&itemById(e.itemId)&&e.qty-backOf(t,e)>(e.deducted||0);});
    if(!ro&&linkedMiss) acts.push(h("button",{class:"ghost danger",onclick:function(){
      if(confirmId==="deduct") deductMissing(t); else {confirmId="deduct";render();}
    }},[confirmId==="deduct"?"Sicher? Bestand wird verringert":"Fehlende vom Lagerbestand abbuchen"]));
    mc.appendChild(h("div",{class:"actions"},acts));
  }
  wrap.appendChild(mc);

  wrap.appendChild(h("div",{class:"actions",style:"margin-top:8px"},ro?[
    h("button",{class:"ghost",onclick:function(){t.status="back";save();render();}},["Wieder öffnen"])
  ]:[
    h("button",{class:"ghost",onclick:function(){t.status="pack";save();render();}},["← Packliste bearbeiten"]),
    h("button",{class:"pri",onclick:function(){t.status="done";save();render();}},["Freizeit abschließen"])
  ]));
  return wrap;
}

function viewData(){
  var msg=h("div",{class:"mute",style:"margin-top:8px"});
  var file=h("input",{type:"file",accept:".json,application/json",style:"display:none",onchange:function(e){
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(!d||!Array.isArray(d.boxes)||!Array.isArray(d.items)) throw 0;
        state=migrate({boxes:d.boxes,items:d.items,trips:d.trips,alias:d.alias,updated:0}); save(); render(); toast("Backup eingespielt");
      }catch(x){msg.textContent="Datei nicht lesbar.";}
    };
    r.readAsText(f);
  }});
  return h("div",{class:"card"},[
    h("h2",null,["Excel-Export"]),
    h("div",{class:"mute"},["Alle Kisten mit Inhalt als .xlsx, nach Kategorien gruppiert (Material, Anzahl, Zugang, Anmerkung, Wo?)."]),
    h("div",{class:"actions"},[h("button",{class:"pri",onclick:exportExcel},["📊 Nach Excel exportieren"])]),
    h("h2",{style:"margin-top:20px"},["Daten sichern"]),
    h("div",{class:"mute"},["Die Daten liegen nur auf diesem Gerät. Mach ab und zu ein Backup."]),
    h("div",{class:"actions"},[
      h("button",{class:"pri",onclick:function(){
        var b=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
        var a=document.createElement("a"); a.href=URL.createObjectURL(b);
        a.download="lager-backup-"+new Date().toISOString().slice(0,10)+".json";
        document.body.appendChild(a); a.click(); a.remove();
      }},["Backup herunterladen"]),
      h("button",{class:"ghost",onclick:function(){file.click();}},["Backup einspielen"]),
      file
    ]),
    msg
  ]);
}
var TABS=[["add","➕ Einlagern"],["kisten","📦 Kisten"],["kategorien","🏷️ Kategorien"],["suche","🔍 Suche"],["freizeit","🏕️ Freizeit"],["daten","💾 Daten"]];
function render(){
  var nav=document.getElementById("tabs"); nav.innerHTML="";
  TABS.forEach(function(t){
    nav.appendChild(h("button",{class:tab===t[0]?"on":"",onclick:function(){tab=t[0];confirmId=null;addingEntryId=null;location.hash=t[0];render();}},[t[1]]));
  });
  var total=state.items.reduce(function(s,i){return s+i.qty;},0);
  document.getElementById("stats").textContent=state.boxes.length+" Kisten · "+state.items.length+" Artikel · "+total+" Stück";
  var app=document.getElementById("app"); app.innerHTML="";
  app.appendChild(tab==="add"?viewAdd():tab==="kisten"?viewBoxes():tab==="kategorien"?viewCats():tab==="daten"?viewData():tab==="freizeit"?viewTrips():viewSearch());
}
window.addEventListener("hashchange",function(){
  var t=(location.hash||"#add").slice(1);
  if(TABS.some(function(x){return x[0]===t;}) && t!==tab){tab=t;render();}
});
render();
})();
</script>
</body>
